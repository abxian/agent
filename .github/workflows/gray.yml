name: Gray candidate verification
on:
  push:
    branches: ["codex/agent177-gray-*"]
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        default: '2.4.0-sx.1'
      installer_sha256:
        description: 'Expected SHA-256 for an isolated run of the NAS Windows installer'
        type: string
        required: false
      legacy_migration:
        description: 'Exercise the migration from the original Windows service'
        type: boolean
        required: false
        default: false
      installer_source:
        description: 'Base64-encoded candidate installer for the isolated Windows test'
        type: string
        required: false
permissions:
  contents: read
jobs:
  verify:
    if: inputs.installer_sha256 == ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-11-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - run: go test ./...
      - name: Race checks
        if: runner.os == 'Linux'
        run: go test -race ./cmd/agent ./model ./pkg/monitor ./pkg/pty ./pkg/fm
      - name: Build native candidate
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ inputs.version || '2.4.0-sx.1' }}
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=false -ldflags="-s -w -X github.com/shenxianhq/agent/pkg/monitor.Version=${CANDIDATE_VERSION}" -o dist/shenxian-agent${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/agent
          if [ '${{ runner.os }}' = Windows ]; then ./dist/shenxian-agent.exe -v; else ./dist/shenxian-agent -v; fi
      - name: Windows standalone user/admin smoke
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CANDIDATE_VERSION: ${{ inputs.version || '2.4.0-sx.1' }}
        run: |
          foreach ($mode in @('user','admin')) {
            go build -trimpath -buildvcs=false -ldflags="-s -w -X github.com/shenxianhq/agent/pkg/monitor.Version=$env:CANDIDATE_VERSION -X main.standaloneMode=$mode" -o "dist/shenxian-agent-$mode.exe" ./cmd/agent
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-FileHash dist/*.exe -Algorithm SHA256 | Format-Table -AutoSize
      - name: Build Windows service installers
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CANDIDATE_VERSION: ${{ inputs.version || '2.4.0-sx.1' }}
        run: |
          $env:CGO_ENABLED = '0'
          foreach ($arch in @('amd64','arm64','386')) {
            $env:GOARCH = $arch
            go build -trimpath -buildvcs=false -ldflags="-s -w -X github.com/shenxianhq/agent/pkg/monitor.Version=$env:CANDIDATE_VERSION" -o "dist/shenxian-agent-windows-$arch.exe" ./cmd/agent
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: gray-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          retention-days: 14

  nas-installer:
    if: inputs.installer_sha256 != ''
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - name: Verify NAS download and run isolated Windows service installation
        shell: powershell
        env:
          LEGACY_MIGRATION: ${{ inputs.legacy_migration }}
          INSTALLER_SOURCE: ${{ inputs.installer_source }}
          EXPECTED_INSTALLER_SHA256: ${{ inputs.installer_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://shell.52nm.de:5443/scripts/shenxian-agent/domain-v3/agent-install.ps1'
          $source = Join-Path $env:RUNNER_TEMP 'panel-agent-installer.ps1'
          if ($env:INSTALLER_SOURCE) {
            [IO.File]::WriteAllBytes($source, [Convert]::FromBase64String($env:INSTALLER_SOURCE))
          } else {
            Invoke-WebRequest -Uri $url -UseBasicParsing -OutFile $source
          }
          if ((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash -ne $env:EXPECTED_INSTALLER_SHA256) {
            throw 'Downloaded installer does not match the reviewed source.'
          }
          $script = [IO.File]::ReadAllText($source)
          $script = $script.Replace('https://domains.52nm.de:5443/v1/shenxian-panel.json', 'https://127.0.0.1:9/nas.json')
          $script = $script.Replace('https://raw.githubusercontent.com/abxian/domain-config/main/manifests/shenxian-panel.json', 'https://127.0.0.1:9/mirror.json')
          $env:SX_SERVER = '127.0.0.1:9'
          $env:SX_AGENT_PATH = Join-Path $env:ProgramFiles 'Shenxian Installer Smoke'
          $env:SX_CLIENT_SECRET = 'synthetic-fixture'
          $config = Join-Path $env:SX_AGENT_PATH 'config.yml'
          $exe = Join-Path $env:SX_AGENT_PATH 'shenxian-agent.exe'
          try {
            $legacy = $env:LEGACY_MIGRATION -eq 'true'
            if ($legacy) {
              New-Item -ItemType Directory -Path $env:SX_AGENT_PATH | Out-Null
              Invoke-WebRequest -Uri 'https://shell.52nm.de:5443/files/shenxian-agent/shenxian-agent-windows-arm64.exe' -UseBasicParsing -OutFile $exe
              $oldHash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
              if ($oldHash -ne 'b1844d4f3462d7e3909ee9d6e87fbbc6cdadbe392c12064866cc332a2e53e4c9') {
                throw 'Unexpected legacy package'
              }
              $fixtureUuid = 'fe76ca65-7b72-4276-8ab7-c0c07ae911d4'
              $legacyConfig = @(
                'server: 127.0.0.1:9', 'tls: true', 'disable_auto_update: true', 'disable_force_update: true',
                "uuid: $fixtureUuid", 'client_secret: synthetic-fixture', 'gpu: true'
              ) -join "`n"
              [IO.File]::WriteAllText($config, $legacyConfig)
              Remove-Item Env:SX_CLIENT_SECRET
              & $exe service install
              if ($LASTEXITCODE -ne 0) { throw 'Legacy registration failed' }
              Start-Service shenxian-agent
              $failure = $script.Replace('Start-Service -Name $serviceName', "throw 'synthetic migration startup error'")
              try {
                Invoke-Expression $failure
                throw 'Expected a synthetic migration failure'
              } catch {
                if ($_.Exception.Message -ne 'synthetic migration startup error') { throw }
              }
              if ((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash -ne $oldHash -or
                  [IO.File]::ReadAllText($config) -ne $legacyConfig -or
                  (Get-Service shenxian-agent).Status -ne 'Running' -or
                  (Get-CimInstance Win32_Service -Filter "Name='shenxian-agent'").StartMode -ne 'Auto' -or
                  (Get-Service shenxian-agent.exe -ErrorAction SilentlyContinue)) {
                throw 'Failed migration did not restore the original service and files'
              }
              Write-Host 'Legacy rollback passed'
            }
            Invoke-Expression $script
            $first = [IO.File]::ReadAllText($config)
            if ($first -notmatch 'uuid:' -or $first -notmatch '127\.0\.0\.1:9/mirror\.json') {
              throw 'Initial installation did not persist device identity and discovery sources.'
            }
            if ($legacy) {
              $legacyService = Get-CimInstance Win32_Service -Filter "Name='shenxian-agent'"
              if ($legacyService.StartMode -ne 'Disabled' -or $legacyService.State -ne 'Stopped') {
                throw "Legacy service mode/state: $($legacyService.StartMode)/$($legacyService.State)"
              }
              $settings = $first -split '\r?\n'
              foreach ($line in "uuid: $fixtureUuid", 'client_secret: synthetic-fixture', 'gpu: true') {
                if ($line -notin $settings) { throw 'Migration did not preserve a legacy setting' }
              }
              Write-Host 'Legacy migration passed'
            } else {
              Remove-Item Env:SX_CLIENT_SECRET
            }
            Invoke-Expression $script
            if ([IO.File]::ReadAllText($config) -ne $first -or (Get-Service shenxian-agent.exe).Status -ne 'Running') {
              throw 'Upgrade did not preserve settings or service state.'
            }
            Start-Sleep -Seconds 25
            $version = & $exe -v
            if ($LASTEXITCODE -ne 0 -or $version -notmatch '2\.4\.0-domain\.3$') {
              throw "Unexpected installed Windows service version: $version"
            }
            Write-Host $version
            if ($first -notmatch 'disable_auto_update: true' -or $first -notmatch 'disable_force_update: true') {
              throw 'The preview needs both legacy binary update paths disabled.'
            }
          } finally {
            if (Get-Service shenxian-agent.exe -ErrorAction SilentlyContinue) {
              Stop-Service shenxian-agent.exe
              sc.exe delete shenxian-agent.exe
              if ($LASTEXITCODE -ne 0) { throw 'Smoke-test Windows service cleanup failed.' }
            }
            if (Get-Service shenxian-agent -ErrorAction SilentlyContinue) {
              Stop-Service shenxian-agent
              sc.exe delete shenxian-agent
              if ($LASTEXITCODE -ne 0) { throw 'Legacy smoke-test service cleanup failed.' }
            }
          }
